<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Payment Management System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: rgb(123, 166, 209);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 24px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 1.8rem;
            color: #1e293b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid #e9ecef;
        }

        .stat-card h3 {
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            color: #5b6e8c;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
        }

        .stat-blue { background: #eef2ff; border-left: 4px solid #3b82f6; }
        .stat-green { background: #ecfdf5; border-left: 4px solid #10b981; }
        .stat-orange { background: #fff7ed; border-left: 4px solid #f97316; }
        .stat-red { background: #fef2f2; border-left: 4px solid #ef4444; }

        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background: none;
        }

        .tab-btn.active {
            background: #3b82f6;
            color: white;
        }

        .form-card {
            background: #f9fafb;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 32px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .form-group {
            flex: 1;
            min-width: 160px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
        }

        button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .btn-secondary { background: #64748b; }
        .btn-warning { background: #f97316; }
        .btn-outline { background: white; color: #1e293b; border: 1px solid #cbd5e1; }

        .action-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f0f2f5;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .status-paid { background: #dcfce7; color: #15803d; }
        .status-pending { background: #fef9c3; color: #854d0e; }
        .status-unpaid { background: #ffe4e2; color: #b91c1c; }
        .status-failed { background: #fee2e2; color: #b91c1c; }

        @media (max-width: 700px) {
            .form-row { flex-direction: column; }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💰 Payment Management System</h1>

    <!-- STATS -->
    <div class="stats-grid">
        <div class="stat-card stat-blue">
            <h3>Total Users</h3>
            <div class="stat-number" id="statTotalUsers">0</div>
        </div>

        <div class="stat-card stat-green">
            <h3>Paid</h3>
            <div class="stat-number" id="statPaid">0</div>
        </div>

        <div class="stat-card stat-orange">
            <h3>Pending</h3>
            <div class="stat-number" id="statPending">0</div>
        </div>

        <div class="stat-card stat-red">
            <h3>Failed</h3>
            <div class="stat-number" id="statFailed">0</div>
        </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="users">Users</button>
        <button class="tab-btn" data-tab="payments">Payments</button>
        <button class="tab-btn" data-tab="schedule">Schedule</button>
    </div>

    <!-- USERS -->
    <div id="usersTab">

        <div class="form-card">
            <form id="addUserForm">
                <div class="form-row">
                    <div class="form-group">
                        <input id="userFullName" placeholder="Full Name" required>
                    </div>

                    <div class="form-group">
                        <input id="userPhone" placeholder="Phone" required>
                    </div>

                    <div class="form-group">
                        <input id="userEmail" placeholder="Email">
                    </div>

                    <button type="submit">Add User</button>
                </div>
            </form>
        </div>

        <div class="action-bar">
            <button class="btn-warning" id="payAllBtn">Pay All</button>
            <button class="btn-secondary" id="paySelectedBtn">Pay Selected</button>
            <button class="btn-outline" id="exportCsvBtn">Export</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAllCheckbox"></th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="usersTableBody">
                    <tr><td colspan="6">Loading...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- OTHER TABS -->
    <div id="paymentsTab" style="display:none;"></div>
    <div id="scheduleTab" style="display:none;"></div>

</div>

<script src="scripts.js"></script>

</body>
</html>
